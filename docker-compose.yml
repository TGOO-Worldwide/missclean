services:
  app:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npm run build"

  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    restart: unless-stopped
